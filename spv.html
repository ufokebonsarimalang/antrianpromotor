<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SPV - Antrian UFO Kebonsari</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0;
            --ha-color: #0284c7; --ha-bg: #f0f9ff;
            --av-color: #7c3aed; --av-bg: #faf5ff;
        }

        *, body, button, select, input { font-family: 'Plus Jakarta Sans', sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; }
        
        .gradient-header { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); border-radius: 16px; padding: 20px; color: white; margin-bottom: 16px; }
        .gradient-header h2 { margin: 0; font-size: 20px; font-weight: 800; }
        .gradient-header p { margin: 4px 0 0 0; opacity: 0.85; font-size: 12px; }

        .control-panel { background: #f1f5f9; border-radius: 14px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
        
        button { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        
        /* JALUR ANTRIAN */
        .container-live-antrian { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; text-align: left; }
        .box-jalur-antrian { border-radius: 14px; padding: 14px; min-height: 100px; }
        .box-ha { background: var(--ha-bg); border: 1px solid #bae6fd; }
        .box-av { background: var(--av-bg); border: 1px solid #e9d5ff; }

        .box-title { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center; }
        .title-ha { color: var(--ha-color); border-bottom-color: var(--ha-color); }
        .title-av { color: var(--av-color); border-bottom-color: var(--av-color); }

        .list-antrian { list-style: none; padding: 0; margin: 0; }
        .list-antrian li { padding: 10px 12px; background: #ffffff; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        .item-info-sales { display: flex; flex-direction: column; gap: 2px; }
        .sales-name { font-weight: 700; color: var(--text-main); }
        .sales-timer { font-size: 10px; font-weight: 600; color: #d97706; }
        
        .action-spv-item { display: flex; align-items: center; gap: 8px; }
        .btn-hapus-item { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; }
        .btn-hapus-item:hover { background: #f87171; color: white; }

        .promotor-link-btn { margin-top: 20px; background: #f0f9ff; border: 1px solid #bae6fd; color: #0284c7; font-size: 11px; padding: 12px; border-radius: 10px; text-decoration: none; display: block; font-weight: 700; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 320px; padding: 20px; border-radius: 16px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; padding: 10px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Panel Kontrol Supervisor</h2>
            <p>UFO Kebonsari - Kelola Antrian Sales</p>
        </div>

        <!-- PANEL KONTROL KELOLA ANTRIAN -->
        <div class="control-panel">
            <div class="status-row">
                <span>Status Sistem Saat Ini:</span>
                <strong id="label-status-sistem" style="color: var(--success);">OPEN</strong>
            </div>
            
            <!-- TOMBOL BUKA/TUTUP ANTRIAN -->
            <button type="button" id="btn-toggle-sistem" class="btn-danger" onclick="toggleStatusSistem()">
                Tutup Pendaftaran Antrian
            </button>

            <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 4px 0; width: 100%;">

            <!-- TOMBOL SAPU BERSIH / RESET -->
            <button type="button" class="btn-warning" onclick="resetSemuaAntrian()" style="background: #ea580c; color: white;">
                🧹 SAPU BERSIH / RESET SEMUA ANTRIAN
            </button>
        </div>

        <!-- DAFTAR MONITORING ANTRIAN -->
        <div class="container-live-antrian">
            <!-- JALUR HA -->
            <div class="box-jalur-antrian box-ha">
                <div class="box-title title-ha">
                    <span>🏠 DAFTAR ANTRIAN HA</span>
                    <span id="cnt-ha">(0)</span>
                </div>
                <ul id="item-antrian-ha" class="list-antrian">
                    <li><span>Memuat...</span></li>
                </ul>
            </div>

            <!-- JALUR AV -->
            <div class="box-jalur-antrian box-av">
                <div class="box-title title-av">
                    <span>📺 DAFTAR ANTRIAN AV</span>
                    <span id="cnt-av">(0)</span>
                </div>
                <ul id="item-antrian-av" class="list-antrian">
                    <li><span>Memuat...</span></li>
                </ul>
            </div>
        </div>

        <a href="index.html" class="promotor-link-btn">📱 KEMBALI KE HALAMAN PROMOTOR</a>
    </div>

    <!-- MODAL -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-primary" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";

        let statusSistemGlobal = "BUKA";

        window.onload = function() {
            muatDataAntrian();
            setInterval(muatDataAntrian, 3000);
            setInterval(updateTimerDisplay, 1000);
        };

        function muatDataAntrian() {
            fetch(`${SCRIPT_URL}?aksi=getAntrian`)
            .then(res => res.json())
            .then(res => {
                if(res && res.status === "sukses") {
                    renderUIRental(res.data, res.statusAntrian);
                }
            });
        }

        function hitungDurasi(waktuMulaiStr) {
            if (!waktuMulaiStr) return "00:00";
            const waktuMulai = new Date(waktuMulaiStr).getTime();
            const sekarang = new Date().getTime();
            let selisihDetik = Math.floor((sekarang - waktuMulai) / 1000);

            if (isNaN(selisihDetik) || selisihDetik < 0) selisihDetik = 0;

            const m = Math.floor(selisihDetik / 60);
            const s = selisihDetik % 60;

            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        function updateTimerDisplay() {
            const timerElements = document.querySelectorAll('.timer-value');
            timerElements.forEach(el => {
                const waktuMulai = el.getAttribute('data-waktu');
                if (waktuMulai) el.innerText = hitungDurasi(waktuMulai);
            });
        }

        function renderUIRental(dataAntrian, statusSistem) {
            statusSistemGlobal = statusSistem || "BUKA";

            const labelStatus = document.getElementById('label-status-sistem');
            const btnToggle = document.getElementById('btn-toggle-sistem');

            if (statusSistemGlobal === "BUKA") {
                labelStatus.innerText = "OPEN (Pendaftaran Dibuka)";
                labelStatus.style.color = "var(--success)";
                btnToggle.innerText = "🔒 TUTUP PENDAFTARAN ANTRIAN";
                btnToggle.className = "btn-danger";
            } else {
                labelStatus.innerText = "CLOSED (Pendaftaran Ditutup)";
                labelStatus.style.color = "var(--danger)";
                btnToggle.innerText = "🔓 BUKA PENDAFTARAN ANTRIAN";
                btnToggle.className = "btn-success";
            }

            const antrianHA = [];
            const antrianAV = [];

            (dataAntrian || []).forEach(item => {
                const kat = String(item.kategori || '').trim().toUpperCase();
                if (kat === 'AV') antrianAV.push(item);
                else antrianHA.push(item);
            });

            document.getElementById('cnt-ha').innerText = `(${antrianHA.length})`;
            document.getElementById('cnt-av').innerText = `(${antrianAV.length})`;

            // RENDER HA
            let htmlHA = "";
            if (antrianHA.length > 0) {
                let urut = 1;
                antrianHA.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    htmlHA += `
                        <li>
                            <div class="item-info-sales">
                                <span class="sales-name">${item.nama} (${isMelayani ? 'Melayani' : 'No. ' + urut++})</span>
                                ${!isMelayani ? `<span class="sales-timer">⏱️ Standby: <span class="timer-value" data-waktu="${item.waktu}">${hitungDurasi(item.waktu)}</span></span>` : '<span class="sales-timer" style="color:var(--success)">🟢 Sedang Melayani</span>'}
                            </div>
                            <div class="action-spv-item">
                                <button type="button" class="btn-hapus-item" onclick="hapusSalesIndividual('${item.nama}')">Hapus</button>
                            </div>
                        </li>`;
                });
            } else { htmlHA = "<li><span style='color:var(--text-muted);'>Antrian Kosong</span></li>"; }
            document.getElementById('item-antrian-ha').innerHTML = htmlHA;

            // RENDER AV
            let htmlAV = "";
            if (antrianAV.length > 0) {
                let urut = 1;
                antrianAV.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    htmlAV += `
                        <li>
                            <div class="item-info-sales">
                                <span class="sales-name">${item.nama} (${isMelayani ? 'Melayani' : 'No. ' + urut++})</span>
                                ${!isMelayani ? `<span class="sales-timer">⏱️ Standby: <span class="timer-value" data-waktu="${item.waktu}">${hitungDurasi(item.waktu)}</span></span>` : '<span class="sales-timer" style="color:var(--success)">🟢 Sedang Melayani</span>'}
                            </div>
                            <div class="action-spv-item">
                                <button type="button" class="btn-hapus-item" onclick="hapusSalesIndividual('${item.nama}')">Hapus</button>
                            </div>
                        </li>`;
                });
            } else { htmlAV = "<li><span style='color:var(--text-muted);'>Antrian Kosong</span></li>"; }
            document.getElementById('item-antrian-av').innerHTML = htmlAV;
        }

        // AKSI SPV: BUKA / TUTUP SISTEM
        function toggleStatusSistem() {
            const statusBaru = statusSistemGlobal === "BUKA" ? "TUTUP" : "BUKA";
            tampilkanModalKonfirmasi("Konfirmasi System", `Ubah status pendaftaran antrian menjadi ${statusBaru}?`, function() {
                fetch(`${SCRIPT_URL}?aksi=spvToggleStatus&statusBaru=${encodeURIComponent(statusBaru)}`)
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Informasi", res.pesan);
                    muatDataAntrian();
                });
            });
        }

        // AKSI SPV: HAPUS PER SALES
        function hapusSalesIndividual(namaSales) {
            tampilkanModalKonfirmasi("Keluarkah Sales?", `Keluarkan (${namaSales}) dari antrian?`, function() {
                fetch(`${SCRIPT_URL}?aksi=spvHapus&namaSales=${encodeURIComponent(namaSales)}`)
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Informasi", res.pesan);
                    muatDataAntrian();
                });
            });
        }

        // AKSI SPV: RESET SEMUA ANTRIAN (SAPU BERSIH)
        function resetSemuaAntrian() {
            tampilkanModalKonfirmasi("PERATURAN RESET", "Apakah Anda yakin ingin MENYAPU BERSIH / MENGHAPUS SELURUH DAFTAR ANTRIAN? Fitur ini biasa digunakan saat tutup toko.", function() {
                fetch(`${SCRIPT_URL}?aksi=spvReset&kategori=SEMUA`)
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Selesai Reset", res.pesan);
                    muatDataAntrian();
                });
            });
        }

        function tampilkanModal(judul, pesan) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = pesan;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-primary" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, pesan, callbackOk) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = pesan;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()">Batal</button>
                <button type="button" id="btn-ok-confirm" class="btn-primary">Lanjutkan</button>
            `;
            document.getElementById('btn-ok-confirm').onclick = function() {
                tutupModal();
                if(callbackOk) callbackOk();
            };
            document.getElementById('custom-modal').classList.add('active');
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
