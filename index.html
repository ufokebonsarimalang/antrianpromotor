<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Walk-In Sales - UFO Kebonsari</title>
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --ha-color: #0284c7;
            --ha-bg: #f0f9ff;
            --ha-border: #bae6fd;
            --av-color: #7c3aed;
            --av-bg: #faf5ff;
            --av-border: #e9d5ff;
        }

        *, body, button, select, input {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px; padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            text-align: center;
        }

        .gradient-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 16px; padding: 18px; color: white; margin-bottom: 14px;
        }
        .gradient-header h2 { margin: 0; font-size: 20px; font-weight: 800; }
        .gradient-header p { margin: 4px 0 0 0; opacity: 0.85; font-size: 12px; }

        .status-badge-sistem {
            display: inline-block; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 16px;
        }
        .status-open { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-closed { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .grid-giliran {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .card-giliran-box {
            border-radius: 14px; padding: 12px; text-align: center;
        }
        .card-ha { background: var(--ha-bg); border: 1px solid var(--ha-border); }
        .card-av { background: var(--av-bg); border: 1px solid var(--av-border); }

        .label-giliran { font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .label-ha { color: var(--ha-color); }
        .label-av { color: var(--av-color); }

        .nama-giliran-aktif { font-size: 15px; font-weight: 800; color: #0f172a; margin-top: 4px; word-break: break-word; }

        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }

        select, input[type="text"] { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
            background: #ffffff; font-size: 13px; color: var(--text-main); outline: none;
        }

        button { 
            width: 100%; padding: 12px; border-radius: 10px; 
            font-size: 12px; font-weight: 700; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .btn-disabled { background: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed !important; }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top-color: #ffffff;
            animation: spin 0.8s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .user-badge {
            background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; margin-bottom: 12px; text-align: left; font-size: 12px;
        }

        .grid-list-antrian {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            text-align: left;
        }

        .box-antrian-jalur {
            border-radius: 12px;
            padding: 10px;
            min-height: 180px;
        }
        .box-ha { background: #f0f9ff; border: 1px solid #bae6fd; }
        .box-av { background: #faf5ff; border: 1px solid #e9d5ff; }

        .box-title {
            font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px;
            border-bottom: 2px solid;
        }
        .title-ha { color: var(--ha-color); border-bottom-color: var(--ha-color); }
        .title-av { color: var(--av-color); border-bottom-color: var(--av-color); }

        .list-antrian { list-style: none; padding: 0; margin: 0; }
        .list-antrian li {
            padding: 8px; background: #ffffff; border-radius: 8px; margin-bottom: 6px;
            border: 1px solid var(--border); font-size: 11px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .nama-sales-list { font-weight: 700; color: var(--text-main); word-break: break-word; }

        .badge-status-item { 
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; width: fit-content;
        }
        .badge-standby { background: #dbeafe; color: #1e40af; }
        .badge-melayani { background: #fef3c7; color: #92400e; }

        .spv-link-btn {
            margin-top: 16px; background: #faf5ff; border: 1px solid #e9d5ff; color: #7c3aed;
            font-size: 11px; padding: 10px; border-radius: 10px; text-decoration: none; display: block; font-weight: 700;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 320px; padding: 20px; border-radius: 16px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; padding: 10px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Antrian Walk-In Sales</h2>
            <p>UFO Kebonsari</p>
        </div>

        <div id="badge-status-sistem" class="status-badge-sistem status-open">
            STATUS ANTRIAN: OPEN
        </div>

        <div class="grid-giliran">
            <div class="card-giliran-box card-ha">
                <div class="label-giliran label-ha">🔥 Next HA</div>
                <div id="nama-aktif-ha" class="nama-giliran-aktif">-</div>
            </div>
            <div class="card-giliran-box card-av">
                <div class="label-giliran label-av">⚡ Next AV</div>
                <div id="nama-aktif-av" class="nama-giliran-aktif">-</div>
            </div>
        </div>

        <!-- PANEL LOGIN -->
        <div id="panel-login" style="display: none;">
            <div class="input-group">
                <label>Pilih Nama Anda (Kunci Perangkat)</label>
                <select id="pilih-sales"><option value="">-- Memuat Data --</option></select>
            </div>
            <button type="button" class="btn-primary" onclick="simpanAkunHP()">Simpan & Kunci di HP Ini</button>
        </div>

        <!-- PANEL UTAMA PROMOTOR -->
        <div id="panel-menu-utama" style="display: none;">
            <div class="user-badge">
                <span>Akun HP Ini:</span> <strong id="label-user-aktif" style="color:var(--primary-dark);">-</strong>
            </div>

            <!-- PILIHAN KATEGORI HANYA MUNCUL JIKA BELUM MASUK ANTRIAN MANAPUN -->
            <div id="container-pilihan-kategori" class="input-group">
                <label>Pilih 1 Jalur Antrian Utama Anda</label>
                <select id="pilih-kategori-antri">
                    <option value="">-- Pilih Salah Satu (HA / AV) --</option>
                    <option value="HA">HA (Home Appliances)</option>
                    <option value="AV">AV (Audio Visual)</option>
                </select>
            </div>

            <button type="button" id="btn-utama-antri" class="btn-success" onclick="aksiUtamaAntri()">Masuk Shift / Ikut Antri</button>
            <button type="button" id="btn-utama-customer" class="btn-primary" onclick="aksiUtamaCustomer()" style="display: none; margin-top: 10px;">Sudah Membawa Customer</button>
        </div>

        <!-- TAMPILAN 2 BOX LIST ANTRIAN TERPISAH -->
        <div class="grid-list-antrian">
            <div class="box-antrian-jalur box-ha">
                <div class="box-title title-ha">
                    <span>🏠 JALUR HA</span>
                    <span id="cnt-ha" style="opacity: 0.7;">(0)</span>
                </div>
                <ul id="item-antrian-ha" class="list-antrian">
                    <li><span style="color:var(--text-muted);">Memuat...</span></li>
                </ul>
            </div>

            <div class="box-antrian-jalur box-av">
                <div class="box-title title-av">
                    <span>📺 JALUR AV</span>
                    <span id="cnt-av" style="opacity: 0.7;">(0)</span>
                </div>
                <ul id="item-antrian-av" class="list-antrian">
                    <li><span style="color:var(--text-muted);">Memuat...</span></li>
                </ul>
            </div>
        </div>

        <a href="spv.html" class="spv-link-btn">🔑 BUKA HALAMAN SPV</a>
    </div>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-primary" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";

        let daftarAntrianGlobal = [];
        let statusSayaGlobal = "belum_ada"; 
        let kategoriSayaGlobal = ""; 
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";
        let sedangProsesAksi = false;

        window.onload = function() {
            cekAkunKeServer();
            muatMasterSales();
            setInterval(muatDataAntrian, 3000); 
        };

        function getDeviceId() {
            let devId = localStorage.getItem('ufo_device_perm_id');
            if (!devId) {
                const info = window.navigator.userAgent + window.navigator.hardwareConcurrency + screen.width + screen.height;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillText("UFO-Kebonsari-Device", 2, 15);
                
                let hash = 0;
                const str = info + canvas.toDataURL();
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                devId = "DEV-HW-" + Math.abs(hash);
                localStorage.setItem('ufo_device_perm_id', devId);
            }
            return devId;
        }

        function cekAkunKeServer() {
            const deviceId = getDeviceId();
            fetch(`${SCRIPT_URL}?aksi=cekBinding&deviceId=${encodeURIComponent(deviceId)}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if (res.status === "terkunci") {
                    namaSalesAktifGlobal = res.nama;
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = res.nama;
                } else {
                    namaSalesAktifGlobal = "";
                    document.getElementById('panel-login').style.display = 'block';
                    document.getElementById('panel-menu-utama').style.display = 'none';
                }
                muatDataAntrian();
            })
            .catch(() => muatDataAntrian());
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            const deviceId = getDeviceId();
            if(!namaPilih) return tampilkanModal("Perhatian", "Silakan pilih nama Anda!");

            tampilkanModalKonfirmasi("Kunci Perangkat", `Kunci HP ini atas nama (${namaPilih})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=kunciPerangkat&namaSales=${encodeURIComponent(namaPilih)}&deviceId=${encodeURIComponent(deviceId)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    if(res.status === "sukses") {
                        namaSalesAktifGlobal = namaPilih;
                        document.getElementById('panel-login').style.display = 'none';
                        document.getElementById('panel-menu-utama').style.display = 'block';
                        document.getElementById('label-user-aktif').innerText = namaPilih;
                        muatDataAntrian();
                        tampilkanModal("Berhasil", `HP terikat untuk: ${namaPilih}`);
                    } else {
                        tampilkanModal("Akses Ditolak", res.pesan);
                    }
                });
            });
        }

        function muatMasterSales() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses") {
                    let html = '<option value="">-- Pilih Nama Anda --</option>';
                    (res.data || []).forEach(n => html += `<option value="${n}">${n}</option>`);
                    document.getElementById('pilih-sales').innerHTML = html;
                }
            });
        }

        function renderUIRental(dataAntrian, statusSistem) {
            daftarAntrianGlobal = dataAntrian || [];
            statusSistemGlobal = statusSistem || "BUKA";
            const akunSaya = namaSalesAktifGlobal.trim().toLowerCase();

            // Status Sistem Header
            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS ANTRIAN: OPEN" : "STATUS ANTRIAN: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            // Pisahkan antrian HA & AV
            const antrianHA = daftarAntrianGlobal.filter(x => String(x.kategori).toUpperCase() === 'HA');
            const antrianAV = daftarAntrianGlobal.filter(x => String(x.kategori).toUpperCase() === 'AV');

            document.getElementById('cnt-ha').innerText = `(${antrianHA.length})`;
            document.getElementById('cnt-av').innerText = `(${antrianAV.length})`;

            const standbyHA = antrianHA.filter(x => x.status === "Standby");
            const standbyAV = antrianAV.filter(x => x.status === "Standby");

            document.getElementById('nama-aktif-ha').innerText = standbyHA.length > 0 ? standbyHA[0].nama : "-";
            document.getElementById('nama-aktif-av').innerText = standbyAV.length > 0 ? standbyAV[0].nama : "-";

            // Cek Status Promotor Login saat ini
            statusSayaGlobal = "belum_ada";
            kategoriSayaGlobal = "";
            let apakahSayaNomorSatu = false;

            daftarAntrianGlobal.forEach(item => {
                if (akunSaya && String(item.nama).trim().toLowerCase() === akunSaya) {
                    statusSayaGlobal = item.status;
                    kategoriSayaGlobal = item.kategori;

                    if (item.kategori === 'HA' && standbyHA.length > 0 && standbyHA[0].nama.toLowerCase() === akunSaya) {
                        apakahSayaNomorSatu = true;
                    }
                    if (item.kategori === 'AV' && standbyAV.length > 0 && standbyAV[0].nama.toLowerCase() === akunSaya) {
                        apakahSayaNomorSatu = true;
                    }
                }
            });

            // RENDER JALUR HA
            let htmlHA = "";
            if (antrianHA.length > 0) {
                let urutHA = 1;
                antrianHA.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    const badgeClass = isMelayani ? "badge-melayani" : "badge-standby";
                    const statusTxt = isMelayani ? "Melayani" : `No. ${urutHA++}`;

                    htmlHA += `
                        <li>
                            <span class="nama-sales-list">${item.nama}</span>
                            <span class="badge-status-item ${badgeClass}">${statusTxt}</span>
                        </li>
                    `;
                });
            } else { 
                htmlHA = `<li><span style="color:var(--text-muted); text-align:center; display:block; padding: 10px 0;">Kosong</span></li>`; 
            }
            document.getElementById('item-antrian-ha').innerHTML = htmlHA;

            // RENDER JALUR AV
            let htmlAV = "";
            if (antrianAV.length > 0) {
                let urutAV = 1;
                antrianAV.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    const badgeClass = isMelayani ? "badge-melayani" : "badge-standby";
                    const statusTxt = isMelayani ? "Melayani" : `No. ${urutAV++}`;

                    htmlAV += `
                        <li>
                            <span class="nama-sales-list">${item.nama}</span>
                            <span class="badge-status-item ${badgeClass}">${statusTxt}</span>
                        </li>
                    `;
                });
            } else { 
                htmlAV = `<li><span style="color:var(--text-muted); text-align:center; display:block; padding: 10px 0;">Kosong</span></li>`; 
            }
            document.getElementById('item-antrian-av').innerHTML = htmlAV;

            // KONTROL INTEGRITAS BINDING / ANTI ANTRI GANDA
            const btnAntri = document.getElementById('btn-utama-antri');
            const btnCustomer = document.getElementById('btn-utama-customer');
            const containerKategori = document.getElementById('container-pilihan-kategori');

            if (statusSayaGlobal === "Melayani") {
                containerKategori.style.display = "none";
                btnAntri.innerText = `Sedang Melayani (${kategoriSayaGlobal})`;
                btnAntri.className = "btn-warning btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "SELESAI PELAYANAN";
                btnCustomer.className = "btn-danger";
                btnCustomer.disabled = false;

            } else if (statusSayaGlobal === "Standby") {
                // KUNCI! Sembunyikan dropdown pilihan agar tidak bisa double-antri ke jalur lain
                containerKategori.style.display = "none";
                btnAntri.innerText = `Terkunci di Jalur (${kategoriSayaGlobal})`;
                btnAntri.className = "btn-success btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "Sudah Membawa Customer";
                btnCustomer.disabled = !apakahSayaNomorSatu;
                btnCustomer.className = apakahSayaNomorSatu ? "btn-primary" : "btn-primary btn-disabled";

            } else {
                // BELUM ADA DI ANTRIAN MANAPUN -> Boleh memilih 1 kategori
                containerKategori.style.display = "block";
                btnCustomer.style.display = "none";

                if (statusSistemGlobal === "TUTUP") {
                    btnAntri.innerText = "Antrian Ditutup SPV";
                    btnAntri.className = "btn-danger btn-disabled";
                    btnAntri.disabled = true;
                } else {
                    btnAntri.innerText = "Masuk Shift / Ikut Antri";
                    btnAntri.className = "btn-success";
                    btnAntri.disabled = false;
                }
            }
        }

        function muatDataAntrian() {
            if (sedangProsesAksi) return;
            fetch(`${SCRIPT_URL}?aksi=getAntrian`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(!sedangProsesAksi && res && res.status === "sukses") {
                    renderUIRental(res.data, res.statusAntrian);
                }
            });
        }

        function aksiUtamaAntri() {
            const namaSales = namaSalesAktifGlobal;
            const kategori = document.getElementById('pilih-kategori-antri').value;

            if(!namaSales) return tampilkanModal("Perhatian", "Akun belum terikat.");
            if(!kategori) return tampilkanModal("Perhatian", "Pilih salah satu jalur antrian terlebih dahulu!");

            sedangProsesAksi = true;
            const btnAntri = document.getElementById('btn-utama-antri');
            btnAntri.disabled = true;
            btnAntri.innerHTML = `<span class="spinner"></span> Memproses...`;

            fetch(`${SCRIPT_URL}?aksi=daftarAntri&namaSales=${encodeURIComponent(namaSales)}&kategori=${encodeURIComponent(kategori)}`, {
                method: 'GET', redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                sedangProsesAksi = false;
                document.getElementById('pilih-kategori-antri').value = ""; 
                tampilkanModal("Informasi Antrian", res.pesan || "Berhasil diproses");
                muatDataAntrian();
            })
            .catch(() => {
                sedangProsesAksi = false;
                muatDataAntrian();
            });
        }

        function aksiUtamaCustomer() {
            const namaSales = namaSalesAktifGlobal;
            if(!namaSales) return;

            const btnCustomer = document.getElementById('btn-utama-customer');

            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Konfirmasi", `Sudah membawa customer?`, function() {
                    sedangProsesAksi = true;
                    btnCustomer.disabled = true;
                    btnCustomer.innerHTML = `<span class="spinner"></span> Memproses...`;

                    fetch(`${SCRIPT_URL}?aksi=ambilAntrian&namaSales=${encodeURIComponent(namaSales)}`, { method: 'GET', redirect: 'follow' })
                    .then(res => res.json())
                    .then(res => {
                        sedangProsesAksi = false;
                        tampilkanModal("Status Antrian", res.pesan || "Berhasil diproses");
                        muatDataAntrian();
                    });
                });
            } else if (statusSayaGlobal === "Melayani") {
                tampilkanModalKonfirmasi("Selesai Pelayanan", `Apakah Anda sudah selesai melayani customer?`, function() {
                    sedangProsesAksi = true;
                    btnCustomer.disabled = true;
                    btnCustomer.innerHTML = `<span class="spinner"></span> Memproses...`;

                    fetch(`${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}`, { method: 'GET', redirect: 'follow' })
                    .then(res => res.json())
                    .then(res => {
                        sedangProsesAksi = false;
                        tampilkanModal("Status Antrian", res.pesan || "Berhasil diproses");
                        muatDataAntrian();
                    });
                });
            }
        }

        function tampilkanModal(judul, pesan) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerHTML = String(pesan).replace(/\n/g, '<br>');
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-primary" onclick="tutupModal()">OK</button>`;
            modal.classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, pesan, callbackOk) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerHTML = pesan;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()">Batal</button>
                <button type="button" id="btn-ok-confirm" class="btn-primary">Lanjutkan</button>
            `;
            document.getElementById('btn-ok-confirm').onclick = function() {
                tutupModal();
                if(callbackOk) callbackOk();
            };
            modal.classList.add('active');
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
