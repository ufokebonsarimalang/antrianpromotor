        let waktuStandbyHAGlobal = null;
        let waktuStandbyAVGlobal = null;
        let daftarAntrianGlobal = [];
        let masterSalesGlobal = [];
        let statusSayaGlobal = "belum_ada"; 
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";
        const BATAS_MENIT = 10;
        var sudahPeringatan1MenitHA = false;
        var sudahPeringatan1MenitAV = false;
        
        let sedangProsesAksi = false;

        window.onload = function() {
            cekAkunKeServer();
            muatMasterSales();
            setInterval(muatDataAntrian, 3000); 
            setInterval(hitungMundurLokal, 1000); 
        };

        function getDeviceId() {
            let devId = localStorage.getItem('ufo_device_perm_id');
            if (!devId) {
                const info = window.navigator.userAgent + window.navigator.hardwareConcurrency + screen.width + screen.height;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillText("UFO-Kebonsari-Device", 2, 15);
                const canvasData = canvas.toDataURL();

                let hash = 0;
                const str = info + canvasData;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash |= 0;
                }
                
                devId = "DEV-HW-" + Math.abs(hash);
                localStorage.setItem('ufo_device_perm_id', devId);
            }
            return devId;
        }

        function cekAkunKeServer() {
            const deviceId = getDeviceId();
            
            fetch(`${SCRIPT_URL}?aksi=cekBinding&deviceId=${encodeURIComponent(deviceId)}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "terkunci") {
                    namaSalesAktifGlobal = res.nama;
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = res.nama;
                    muatDataAntrian();
                } else {
                    namaSalesAktifGlobal = "";
                    document.getElementById('panel-login').style.display = 'block';
                    document.getElementById('panel-menu-utama').style.display = 'none';
                    document.getElementById('pilih-sales').value = ""; 
                    muatDataAntrian();
                }
            })
            .catch(err => {
                console.error("Gagal mengecek akun:", err);
                muatDataAntrian();
            });
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            const deviceId = getDeviceId();
            if(!namaPilih) return tampilkanModal("Perhatian", "Silakan pilih nama Anda!");

            tampilkanModalKonfirmasi("Kunci Perangkat", `Kunci HP ini atas nama (${namaPilih})?`, function() {
                const btnSimpan = document.querySelector('#panel-login button');
                const textAsli = btnSimpan.innerHTML;
                btnSimpan.disabled = true;
                btnSimpan.innerHTML = `<span class="spinner"></span> Menyimpan...`;

                fetch(`${SCRIPT_URL}?aksi=kunciPerangkat&namaSales=${encodeURIComponent(namaPilih)}&deviceId=${encodeURIComponent(deviceId)}`, {
                    method: 'GET',
                    redirect: 'follow'
                })
                .then(res => res.json())
                .then(res => {
                    setTimeout(() => {
                        btnSimpan.disabled = false;
                        btnSimpan.innerHTML = textAsli;
                        
                        if(res.status === "sukses") {
                            namaSalesAktifGlobal = namaPilih;
                            document.getElementById('panel-login').style.display = 'none';
                            document.getElementById('panel-menu-utama').style.display = 'block';
                            document.getElementById('label-user-aktif').innerText = namaPilih;
                            muatDataAntrian();
                            tampilkanModal("Berhasil", `HP terikat untuk: ${namaPilih}`);
                        } else {
                            namaSalesAktifGlobal = ""; 
                            document.getElementById('pilih-sales').value = ""; 
                            document.getElementById('panel-login').style.display = 'block'; 
                            document.getElementById('panel-menu-utama').style.display = 'none'; 
                            
                            tampilkanModal("Akses Ditolak", res.pesan);
                        }
                    }, 400);
                }).catch(() => {
                    btnSimpan.disabled = false;
                    btnSimpan.innerHTML = textAsli;
                    tampilkanModal("Gagal", "Terjadi gangguan jaringan saat mengunci perangkat.");
                });
            });
        }

        function getAkunAktif() {
            return namaSalesAktifGlobal;
        }

        function hitungMundurLokal() {
            const labelTimerHA = document.getElementById('timer-mundur-ha');
            const labelTimerAV = document.getElementById('timer-mundur-av');
            const now = new Date().getTime();

            // Timer HA selalu tampil (jika ada waktu standby HA aktif, hitung mundurnya; jika tidak, tampilkan 00:00)
            if (waktuStandbyHAGlobal) {
                const waktuHA = new Date(waktuStandbyHAGlobal).getTime();
                if (!isNaN(waktuHA)) {
                    const selisihMs = now - waktuHA;
                    const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;
                    if (sisaMs > 0) {
                        const totalDetik = Math.floor(sisaMs / 1000);
                        const menit = Math.floor(totalDetik / 60);
                        const detik = totalDetik % 60;
                        labelTimerHA.innerText = `${menit}:${detik < 10 ? '0' : ''}${detik}`;
                    } else {
                        labelTimerHA.innerText = `Habis!`;
                    }
                } else {
                    labelTimerHA.innerText = "00:00";
                }
            } else {
                labelTimerHA.innerText = "00:00";
            }

            // Timer AV selalu tampil (jika ada waktu standby AV aktif, hitung mundurnya; jika tidak, tampilkan 00:00)
            if (waktuStandbyAVGlobal) {
                const waktuAV = new Date(waktuStandbyAVGlobal).getTime();
                if (!isNaN(waktuAV)) {
                    const selisihMs = now - waktuAV;
                    const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;
                    if (sisaMs > 0) {
                        const totalDetik = Math.floor(sisaMs / 1000);
                        const menit = Math.floor(totalDetik / 60);
                        const detik = totalDetik % 60;
                        labelTimerAV.innerText = `${menit}:${detik < 10 ? '0' : ''}${detik}`;
                    } else {
                        labelTimerAV.innerText = `Habis!`;
                    }
                } else {
                    labelTimerAV.innerText = "00:00";
                }
            } else {
                labelTimerAV.innerText = "00:00";
            }
        }

        function prosesCekPeringatanStandby(response, namaPromotorLogin) {
            if (response.data && response.data.length > 0) {
                let listStandby = response.data.filter(item => item.status === "Standby");
                if (listStandby.length > 0) {
                    let standbyHA = listStandby.find(item => (item.kategori || "HA") === "HA");
                    let standbyAV = listStandby.find(item => item.kategori === "AV");

                    // Cek Peringatan HA
                    if (standbyHA && standbyHA.nama === namaPromotorLogin) {
                        let sisaDetikHA = response.sisaDetikHA !== undefined ? response.sisaDetikHA : response.sisaDetik;
                        if (sisaDetikHA !== null && sisaDetikHA <= 60 && sisaDetikHA > 0 && !sudahPeringatan1MenitHA) {
                            sudahPeringatan1MenitHA = true;
                            if ("vibrate" in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
                            tampilkanModal("⚠️ PERINGATAN STANDBY HA!", "Waktu standby HA tinggal 1 menit lagi! Hubungi SPV.");
                        }
                        if (sisaDetikHA > 60) sudahPeringatan1MenitHA = false;
                    }

                    // Cek Peringatan AV
                    if (standbyAV && standbyAV.nama === namaPromotorLogin) {
                        let sisaDetikAV = response.sisaDetikAV !== undefined ? response.sisaDetikAV : response.sisaDetik;
                        if (sisaDetikAV !== null && sisaDetikAV <= 60 && sisaDetikAV > 0 && !sudahPeringatan1MenitAV) {
                            sudahPeringatan1MenitAV = true;
                            if ("vibrate" in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
                            tampilkanModal("⚠️ PERINGATAN STANDBY AV!", "Waktu standby AV tinggal 1 menit lagi! Hubungi SPV.");
                        }
                        if (sisaDetikAV > 60) sudahPeringatan1MenitAV = false;
                    }
                }
            }
        }

        function muatMasterSales() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses") {
                    masterSalesGlobal = res.data || [];
                    let html = '<option value="">-- Pilih Nama Anda --</option>';
                    masterSalesGlobal.forEach(n => html += `<option value="${n}">${n}</option>`);
                    document.getElementById('pilih-sales').innerHTML = html;
                }
            }).catch(err => console.error("Gagal muat master sales"));
        }

        function renderUIRental(dataAntrian, statusSistem, waktuStandbyHA, waktuStandbyAV) {
            daftarAntrianGlobal = dataAntrian || [];
            statusSistemGlobal = statusSistem || "BUKA";
            waktuStandbyHAGlobal = waktuStandbyHA || null;
            waktuStandbyAVGlobal = waktuStandbyAV || null;
            const akunSaya = getAkunAktif().trim();

            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS ANTRIAN: OPEN" : "STATUS ANTRIAN: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            let listHtmlHA = "";
            let listHtmlAV = "";
            let namaHANow = "-";
            let namaAVNow = "-";
            statusSayaGlobal = "belum_ada"; 
            let apakahSayaUrutanPertamaHA = false;
            let apakahSayaUrutanPertamaAV = false;

            let listStandby = daftarAntrianGlobal.filter(item => item.status === "Standby");
            let standbyHA = listStandby.find(item => (item.kategori || "HA") === "HA");
            let standbyAV = listStandby.find(item => item.kategori === "AV");

            if (standbyHA) {
                namaHANow = standbyHA.nama;
                if (akunSaya && standbyHA.nama.trim().toLowerCase() === akunSaya.toLowerCase()) {
                    apakahSayaUrutanPertamaHA = true;
                }
            }
            if (standbyAV) {
                namaAVNow = standbyAV.nama;
                if (akunSaya && standbyAV.nama.trim().toLowerCase() === akunSaya.toLowerCase()) {
                    apakahSayaUrutanPertamaAV = true;
                }
            }

            if(daftarAntrianGlobal.length > 0) {
                let urutHA = 1;
                let urutAV = 1;
                
                daftarAntrianGlobal.forEach((item) => {
                    const namaItem = String(item.nama).trim();
                    const kategoriItem = item.kategori ? item.kategori : "HA"; 

                    if(akunSaya && namaItem.toLowerCase() === akunSaya.toLowerCase()) {
                        statusSayaGlobal = item.status; 
                        const selectKat = document.getElementById('pilih-kategori');
                        if (selectKat && kategoriItem) {
                            selectKat.value = kategoriItem;
                        }
                    }

                    let itemHtml = "";
                    if (item.status === "Standby") {
                        let urut = kategoriItem === "AV" ? urutAV++ : urutHA++;
                        itemHtml = `<li><b>${urut}. ${item.nama}</b> <div><span class="badge-status-item badge-standby">Standby</span></div></li>`;
                    } else if (item.status === "Melayani") {
                        itemHtml = `<li><b>${item.nama}</b> <div><span class="badge-status-item badge-melayani">Melayani (${kategoriItem})</span></div></li>`;
                    }

                    if (kategoriItem === "AV") {
                        listHtmlAV += itemHtml;
                    } else {
                        listHtmlHA += itemHtml;
                    }
                });
            }

            if(!listHtmlHA) listHtmlHA = "<li><span style='color:#94a3b8; font-style:italic;'>Belum ada antrian HA</span></li>";
            if(!listHtmlAV) listHtmlAV = "<li><span style='color:#94a3b8; font-style:italic;'>Belum ada antrian AV</span></li>";

            const btnAntri = document.getElementById('btn-utama-antri');
            const btnCustomer = document.getElementById('btn-utama-customer');
            const selectKategori = document.getElementById('pilih-kategori');

            if (btnAntri.dataset.loading === "true" || btnCustomer.dataset.loading === "true") {
                document.getElementById('nama-aktif-ha').innerText = namaHANow;
                document.getElementById('nama-aktif-av').innerText = namaAVNow;
                document.getElementById('item-antrian-list-ha').innerHTML = listHtmlHA;
                document.getElementById('item-antrian-list-av').innerHTML = listHtmlAV;
                return;
            }

            if (statusSayaGlobal === "Melayani") {
                btnAntri.innerText = "Sedang Melayani Customer";
                btnAntri.className = "btn-warning btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "SELESAI PELAYANAN";
                btnCustomer.className = "btn-danger";
                btnCustomer.disabled = false;

                selectKategori.disabled = true;

            } else if (statusSayaGlobal === "Standby") {
                btnAntri.innerText = "Anda Sudah Di Antrian";
                btnAntri.className = "btn-success btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "Sudah Membawa Customer";
                
                let kategoriSaya = selectKategori.value;
                let bisaAmbil = (kategoriSaya === "AV" && apakahSayaUrutanPertamaAV) || (kategoriSaya !== "AV" && apakahSayaUrutanPertamaHA);

                btnCustomer.disabled = !bisaAmbil;
                btnCustomer.className = bisaAmbil ? "btn-primary" : "btn-primary btn-disabled";

                selectKategori.disabled = true;

            } else { 
                if (statusSistemGlobal === "TUTUP") {
                    btnAntri.innerText = "Antrian Ditutup Oleh SPV";
                    btnAntri.className = "btn-danger btn-disabled";
                    btnAntri.disabled = true;
                } else {
                    btnAntri.innerText = "Masuk Shift / Ikut Antri";
                    btnAntri.className = "btn-success";
                    btnAntri.disabled = false;
                }
                btnCustomer.style.display = "none";
                selectKategori.disabled = false;
            }

            document.getElementById('nama-aktif-ha').innerText = namaHANow;
            document.getElementById('nama-aktif-av').innerText = namaAVNow;
            document.getElementById('item-antrian-list-ha').innerHTML = listHtmlHA;
            document.getElementById('item-antrian-list-av').innerHTML = listHtmlAV;
        }

        function muatDataAntrian() {
            if (sedangProsesAksi) return;

            fetch(`${SCRIPT_URL}?aksi=getAntrian`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if(!sedangProsesAksi && res && res.status === "sukses") {
                    const akunSaya = getAkunAktif().trim();
                    prosesCekPeringatanStandby(res, akunSaya);
                    renderUIRental(res.data, res.statusAntrian, res.waktuStandbyHA || res.waktuStandbyPertama, res.waktuStandbyAV);
                }
            }).catch(err => {
                console.log("Menunggu sinkronisasi server...");
            });
        }

        function aksiUtamaAntri() {
            const namaSales = getAkunAktif();
            const kategoriPilih = document.getElementById('pilih-kategori').value;
            if(!namaSales) return tampilkanModal("Perhatian", "Akun belum terikat.");
            
            sedangProsesAksi = true; 

            const btnAntri = document.getElementById('btn-utama-antri');
            btnAntri.dataset.loading = "true";
            btnAntri.disabled = true;
            btnAntri.innerHTML = `<span class="spinner"></span> Memproses...`;

            document.getElementById('pilih-kategori').disabled = true;

            statusSayaGlobal = "Standby";
            let tempSembuhList = [...daftarAntrianGlobal];
            if(!tempSembuhList.some(x => String(x.nama).trim().toLowerCase() === namaSales.trim().toLowerCase())) {
                tempSembuhList.push({ nama: namaSales, status: "Standby", kategori: kategoriPilih });
            }
            renderUIRental(tempSembuhList, statusSistemGlobal, waktuStandbyHAGlobal, waktuStandbyAVGlobal);

            fetch(`${SCRIPT_URL}?aksi=daftarAntri&namaSales=${encodeURIComponent(namaSales)}&kategori=${encodeURIComponent(kategoriPilih)}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                tampilkanModal("Informasi Shift", res.pesan || "Berhasil diproses");
                setTimeout(() => {
                    btnAntri.dataset.loading = "false";
                    sedangProsesAksi = false;
                    muatDataAntrian();
                }, 1500);
            })
            .catch(err => {
                btnAntri.dataset.loading = "false";
                sedangProsesAksi = false;
                muatDataAntrian();
            });
        }

        function aksiUtamaCustomer() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;

            const btnCustomer = document.getElementById('btn-utama-customer');

            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Konfirmasi", `Sudah membawa customer?`, function() {
                    sedangProsesAksi = true;
                    btnCustomer.dataset.loading = "true";
                    btnCustomer.disabled = true;
                    btnCustomer.innerHTML = `<span class="spinner"></span> Memproses...`;
                    
                    statusSayaGlobal = "Melayani";
                    renderUIRental(daftarAntrianGlobal, statusSistemGlobal, waktuStandbyHAGlobal, waktuStandbyAVGlobal);

                    fetch(`${SCRIPT_URL}?aksi=ambilAntrian&namaSales=${encodeURIComponent(namaSales)}`, {
                        method: 'GET',
                        redirect: 'follow'
                    })
                    .then(res => res.json())
                    .then(res => {
                        tampilkanModal("Status Antrian", res.pesan || "Berhasil diproses");
                        setTimeout(() => {
                            btnCustomer.dataset.loading = "false";
                            sedangProsesAksi = false;
                            muatDataAntrian();
                        }, 1500);
                    })
                    .catch(err => {
                        btnCustomer.dataset.loading = "false";
                        sedangProsesAksi = false;
                        muatDataAntrian();
                    });
                });
            } else if (statusSayaGlobal === "Melayani") {
                tampilkanModalKonfirmasi("Selesai Pelayanan", `Apakah Anda sudah selesai melayani customer?`, function() {
                    sedangProsesAksi = true;
                    btnCustomer.dataset.loading = "true";
                    btnCustomer.disabled = true;
                    btnCustomer.innerHTML = `<span class="spinner"></span> Memproses...`;
                    
                    statusSayaGlobal = "belum_ada";
                    renderUIRental(daftarAntrianGlobal.filter(x => x.nama.toLowerCase() !== namaSales.toLowerCase()), statusSistemGlobal, waktuStandbyHAGlobal, waktuStandbyAVGlobal);

                    fetch(`${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}`, {
                        method: 'GET',
                        redirect: 'follow'
                    })
                    .then(res => res.json())
                    .then(res => {
                        tampilkanModal("Status Antrian", res.pesan || "Berhasil diproses");
                        setTimeout(() => {
                            btnCustomer.dataset.loading = "false";
                            sedangProsesAksi = false;
                            muatDataAntrian();
                        }, 1500);
                    })
                    .catch(err => {
                        btnCustomer.dataset.loading = "false";
                        sedangProsesAksi = false;
                        muatDataAntrian();
                    });
                });
            }
        }

        function tampilkanModal(judul, pesan) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerHTML = String(pesan).replace(/\n/g, '<br>');
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-primary" onclick="tutupModal()">OK</button>`;
            modal.classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, pesan, callbackOk) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerHTML = pesan;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()">Batal</button>
                <button type="button" id="btn-ok-confirm" class="btn-primary">Lanjutkan</button>
            `;
            document.getElementById('btn-ok-confirm').onclick = function() {
                tutupModal();
                if(callbackOk) callbackOk();
            };
            modal.classList.add('active');
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
