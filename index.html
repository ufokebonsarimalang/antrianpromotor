<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Walk-In Sales - UFO Kebonsari</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0;
            --ha-color: #0284c7; --ha-bg: #f0f9ff;
            --av-color: #7c3aed; --av-bg: #faf5ff;
        }

        *, body, button, select, input { font-family: 'Plus Jakarta Sans', sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); border-radius: 16px; padding: 20px; color: white; margin-bottom: 16px; }
        .gradient-header h2 { margin: 0; font-size: 20px; font-weight: 800; }
        .gradient-header p { margin: 4px 0 0 0; opacity: 0.85; font-size: 12px; }

        .status-badge-sistem { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 16px; }
        .status-open { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-closed { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        select, input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #ffffff; font-size: 13px; color: var(--text-main); outline: none; }

        button { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .btn-disabled { background: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed !important; }

        .user-badge { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: left; font-size: 12px; }

        /* JALUR ANTRIAN ATAS-BAWAH */
        .container-live-antrian { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; text-align: left; }
        .box-jalur-antrian { border-radius: 14px; padding: 14px; min-height: 100px; }
        .box-ha { background: var(--ha-bg); border: 1px solid #bae6fd; }
        .box-av { background: var(--av-bg); border: 1px solid #e9d5ff; }

        .box-title { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center; }
        .title-ha { color: var(--ha-color); border-bottom-color: var(--ha-color); }
        .title-av { color: var(--av-color); border-bottom-color: var(--av-color); }

        .list-antrian { list-style: none; padding: 0; margin: 0; }
        .list-antrian li { padding: 10px 12px; background: #ffffff; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        /* TIMER STYLES */
        .item-info-sales { display: flex; flex-direction: column; gap: 2px; }
        .sales-name { font-weight: 700; color: var(--text-main); }
        .sales-timer { font-size: 10px; font-weight: 600; color: #d97706; display: flex; align-items: center; gap: 4px; }

        .badge-status-item { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; }
        .badge-standby { background: #dbeafe; color: #1e40af; }
        .badge-melayani { background: #fef3c7; color: #92400e; }

        .spv-link-btn { margin-top: 20px; background: #faf5ff; border: 1px solid #e9d5ff; color: #7c3aed; font-size: 11px; padding: 12px; border-radius: 10px; text-decoration: none; display: block; font-weight: 700; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 320px; padding: 20px; border-radius: 16px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; padding: 10px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Antrian Walk-In Sales</h2>
            <p>UFO Kebonsari</p>
        </div>

        <div id="badge-status-sistem" class="status-badge-sistem status-open">
            STATUS ANTRIAN: OPEN
        </div>

        <!-- LOGIN PANEL -->
        <div id="panel-login" style="display: none;">
            <div class="input-group">
                <label>Pilih Nama Anda (Kunci Perangkat)</label>
                <select id="pilih-sales"><option value="">-- Memuat Data --</option></select>
            </div>
            <button type="button" class="btn-primary" onclick="simpanAkunHP()">Simpan & Kunci di HP Ini</button>
        </div>

        <!-- MAIN PANEL -->
        <div id="panel-menu-utama" style="display: none;">
            <div class="user-badge">
                <span>Akun HP Ini:</span> <strong id="label-user-aktif" style="color:var(--primary-dark);">-</strong>
            </div>

            <div id="container-pilihan-kategori" class="input-group">
                <label>Pilih Divisi Antrian</label>
                <select id="pilih-kategori-antri">
                    <option value="">-- Pilih Kategori Produk --</option>
                    <option value="HA">HA (Home Appliances)</option>
                    <option value="AV">AV (Audio Visual)</option>
                </select>
            </div>

            <button type="button" id="btn-utama-antri" class="btn-success" onclick="aksiUtamaAntri()">Masuk Shift / Ikut Antri</button>
            <button type="button" id="btn-utama-customer" class="btn-primary" onclick="aksiUtamaCustomer()" style="display: none; margin-top: 10px;">Sudah Membawa Customer</button>
        </div>

        <!-- LIVE DISPLAY ATAS BAWAH -->
        <div class="container-live-antrian">
            <!-- JALUR HA (ATAS) -->
            <div class="box-jalur-antrian box-ha">
                <div class="box-title title-ha">
                    <span>🏠 ANTRIAN HA (Home Appliances)</span>
                    <span id="cnt-ha">(0)</span>
                </div>
                <ul id="item-antrian-ha" class="list-antrian">
                    <li><span>Memuat...</span></li>
                </ul>
            </div>

            <!-- JALUR AV (BAWAH) -->
            <div class="box-jalur-antrian box-av">
                <div class="box-title title-av">
                    <span>📺 ANTRIAN AV (Audio Visual)</span>
                    <span id="cnt-av">(0)</span>
                </div>
                <ul id="item-antrian-av" class="list-antrian">
                    <li><span>Memuat...</span></li>
                </ul>
            </div>
        </div>

        <a href="spv.html" class="spv-link-btn">🔑 BUKA HALAMAN SPV</a>
    </div>

    <!-- MODAL -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-primary" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";

        let statusSayaGlobal = "belum_ada"; 
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";

        window.onload = function() {
            cekAkunKeServer();
            muatMasterSales();
            setInterval(muatDataAntrian, 3000); 
            setInterval(updateTimerDisplay, 1000); // REFRESH TIMER TIAP DETIK
        };

        function getDeviceId() {
            let devId = localStorage.getItem('ufo_device_perm_id');
            if (!devId) {
                devId = "DEV-" + Math.floor(Math.random() * 899999 + 100000);
                localStorage.setItem('ufo_device_perm_id', devId);
            }
            return devId;
        }

        function cekAkunKeServer() {
            const deviceId = getDeviceId();
            fetch(`${SCRIPT_URL}?aksi=cekBinding&deviceId=${encodeURIComponent(deviceId)}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "terkunci") {
                    namaSalesAktifGlobal = res.nama;
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = res.nama;
                } else {
                    document.getElementById('panel-login').style.display = 'block';
                    document.getElementById('panel-menu-utama').style.display = 'none';
                }
                muatDataAntrian();
            });
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            const deviceId = getDeviceId();
            if(!namaPilih) return tampilkanModal("Perhatian", "Pilih nama Anda!");

            tampilkanModalKonfirmasi("Kunci Perangkat", `Kunci HP ini atas nama (${namaPilih})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=kunciPerangkat&namaSales=${encodeURIComponent(namaPilih)}&deviceId=${encodeURIComponent(deviceId)}`)
                .then(res => res.json())
                .then(res => {
                    namaSalesAktifGlobal = namaPilih;
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = namaPilih;
                    muatDataAntrian();
                });
            });
        }

        function muatMasterSales() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses") {
                    let html = '<option value="">-- Pilih Nama Anda --</option>';
                    (res.data || []).forEach(n => html += `<option value="${n}">${n}</option>`);
                    document.getElementById('pilih-sales').innerHTML = html;
                }
            });
        }

        function muatDataAntrian() {
            fetch(`${SCRIPT_URL}?aksi=getAntrian`)
            .then(res => res.json())
            .then(res => {
                if(res && res.status === "sukses") {
                    renderUIRental(res.data, res.statusAntrian);
                }
            });
        }

        // FUNGSI LOGIKA HITUNG TIMER STANDBY
        function hitungDurasi(waktuMulaiStr) {
            if (!waktuMulaiStr) return "00:00";
            const waktuMulai = new Date(waktuMulaiStr).getTime();
            const sekarang = new Date().getTime();
            let selisihDetik = Math.floor((sekarang - waktuMulai) / 1000);

            if (isNaN(selisihDetik) || selisihDetik < 0) selisihDetik = 0;

            const m = Math.floor(selisihDetik / 60);
            const s = selisihDetik % 60;

            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        function updateTimerDisplay() {
            const timerElements = document.querySelectorAll('.timer-value');
            timerElements.forEach(el => {
                const waktuMulai = el.getAttribute('data-waktu');
                if (waktuMulai) el.innerText = hitungDurasi(waktuMulai);
            });
        }

        function renderUIRental(dataAntrian, statusSistem) {
            statusSistemGlobal = statusSistem || "BUKA";
            const akunSaya = namaSalesAktifGlobal.trim().toLowerCase();

            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS ANTRIAN: OPEN" : "STATUS ANTRIAN: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            const antrianHA = [];
            const antrianAV = [];

            (dataAntrian || []).forEach(item => {
                const kat = String(item.kategori || '').trim().toUpperCase();
                if (kat === 'AV') {
                    antrianAV.push(item);
                } else {
                    antrianHA.push(item);
                }
            });

            document.getElementById('cnt-ha').innerText = `(${antrianHA.length})`;
            document.getElementById('cnt-av').innerText = `(${antrianAV.length})`;

            statusSayaGlobal = "belum_ada";
            (dataAntrian || []).forEach(item => {
                if (akunSaya && String(item.nama).trim().toLowerCase() === akunSaya) {
                    statusSayaGlobal = item.status;
                }
            });

            // RENDER HA
            let htmlHA = "";
            if (antrianHA.length > 0) {
                let urut = 1;
                antrianHA.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    htmlHA += `
                        <li>
                            <div class="item-info-sales">
                                <span class="sales-name">${item.nama}</span>
                                ${!isMelayani ? `<span class="sales-timer">⏱️ <span class="timer-value" data-waktu="${item.waktu}">${hitungDurasi(item.waktu)}</span></span>` : ''}
                            </div>
                            <span class="badge-status-item ${isMelayani ? 'badge-melayani' : 'badge-standby'}">
                                ${isMelayani ? 'Melayani' : 'No. ' + urut++}
                            </span>
                        </li>`;
                });
            } else { htmlHA = "<li><span style='color:var(--text-muted);'>Kosong</span></li>"; }
            document.getElementById('item-antrian-ha').innerHTML = htmlHA;

            // RENDER AV
            let htmlAV = "";
            if (antrianAV.length > 0) {
                let urut = 1;
                antrianAV.forEach(item => {
                    const isMelayani = item.status === "Melayani";
                    htmlAV += `
                        <li>
                            <div class="item-info-sales">
                                <span class="sales-name">${item.nama}</span>
                                ${!isMelayani ? `<span class="sales-timer">⏱️ <span class="timer-value" data-waktu="${item.waktu}">${hitungDurasi(item.waktu)}</span></span>` : ''}
                            </div>
                            <span class="badge-status-item ${isMelayani ? 'badge-melayani' : 'badge-standby'}">
                                ${isMelayani ? 'Melayani' : 'No. ' + urut++}
                            </span>
                        </li>`;
                });
            } else { htmlAV = "<li><span style='color:var(--text-muted);'>Kosong</span></li>"; }
            document.getElementById('item-antrian-av').innerHTML = htmlAV;

            // KONTROL TOMBOL
            const btnAntri = document.getElementById('btn-utama-antri');
            const btnCustomer = document.getElementById('btn-utama-customer');
            const containerKategori = document.getElementById('container-pilihan-kategori');

            if (statusSayaGlobal === "Melayani") {
                containerKategori.style.display = "none";
                btnAntri.innerText = "Sedang Melayani Customer";
                btnAntri.className = "btn-warning btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "SELESAI PELAYANAN";
                btnCustomer.className = "btn-danger";
            } else if (statusSayaGlobal === "Standby") {
                containerKategori.style.display = "none";
                btnAntri.innerText = "Sudah Dalam Antrian";
                btnAntri.className = "btn-success btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnCustomer.innerText = "Sudah Membawa Customer";
                btnCustomer.className = "btn-primary";
            } else {
                containerKategori.style.display = "block";
                btnCustomer.style.display = "none";

                if (statusSistemGlobal === "TUTUP") {
                    btnAntri.innerText = "Antrian Ditutup SPV";
                    btnAntri.className = "btn-danger btn-disabled";
                    btnAntri.disabled = true;
                } else {
                    btnAntri.innerText = "Masuk Shift / Ikut Antri";
                    btnAntri.className = "btn-success";
                    btnAntri.disabled = false;
                }
            }
        }

        function aksiUtamaAntri() {
            const namaSales = namaSalesAktifGlobal;
            const kategori = document.getElementById('pilih-kategori-antri').value;

            if(!namaSales) return tampilkanModal("Perhatian", "Akun belum terikat.");
            if(!kategori) return tampilkanModal("Perhatian", "Silakan pilih divisi HA atau AV!");

            fetch(`${SCRIPT_URL}?aksi=daftarAntri&namaSales=${encodeURIComponent(namaSales)}&kategori=${encodeURIComponent(kategori)}`)
            .then(res => res.json())
            .then(res => {
                document.getElementById('pilih-kategori-antri').value = ""; 
                tampilkanModal("Informasi Antrian", res.pesan);
                muatDataAntrian();
            });
        }

        function aksiUtamaCustomer() {
            const namaSales = namaSalesAktifGlobal;
            if(!namaSales) return;

            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Konfirmasi", "Sudah membawa customer?", function() {
                    fetch(`${SCRIPT_URL}?aksi=ambilAntrian&namaSales=${encodeURIComponent(namaSales)}`)
                    .then(res => res.json())
                    .then(res => { tampilkanModal("Status Antrian", res.pesan); muatDataAntrian(); });
                });
            } else if (statusSayaGlobal === "Melayani") {
                tampilkanModalKonfirmasi("Selesai Pelayanan", "Apakah Anda sudah selesai melayani customer?", function() {
                    fetch(`${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}`)
                    .then(res => res.json())
                    .then(res => { tampilkanModal("Status Antrian", res.pesan); muatDataAntrian(); });
                });
            }
        }

        function tampilkanModal(judul, pesan) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = pesan;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-primary" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, pesan, callbackOk) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = pesan;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()">Batal</button>
                <button type="button" id="btn-ok-confirm" class="btn-primary">Lanjutkan</button>
            `;
            document.getElementById('btn-ok-confirm').onclick = function() {
                tutupModal();
                if(callbackOk) callbackOk();
            };
            document.getElementById('custom-modal').classList.add('active');
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
