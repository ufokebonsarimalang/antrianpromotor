<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Tambah Waktu Timer - UFO Kebonsari</title>
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        *, body, button, select {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px; padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            text-align: center;
        }

        .gradient-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 16px; padding: 20px; color: white; margin-bottom: 20px;
        }
        .gradient-header h2 { margin: 0; font-size: 18px; font-weight: 800; }
        .gradient-header p { margin: 4px 0 0 0; opacity: 0.85; font-size: 12px; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }

        select { 
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
            background: #ffffff; font-size: 14px; color: var(--text-main); outline: none;
        }

        button { 
            width: 100%; padding: 14px; border-radius: 10px; 
            font-size: 13px; font-weight: 700; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            background: var(--primary); color: white;
        }
        button:active { transform: scale(0.98); }

        .info-box {
            background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px;
            padding: 12px; font-size: 12px; color: #1e40af; margin-bottom: 20px; text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Panel Tambah Waktu Timer</h2>
            <p>UFO Kebonsari</p>
        </div>

        <div class="info-box">
            ℹ️ Pilih nama promotor yang sedang dalam status <b>Standby</b>. Sisa timer aktif akan terlihat di samping nama.
        </div>

        <div class="input-group">
            <label>Pilih Promotor & Sisa Waktu</label>
            <select id="select-promotor-standby" onfocus="sedangFokus = true" onblur="sedangFokus = false">
                <option value="">-- Memuat daftar promotor... --</option>
            </select>
        </div>

        <button type="button" onclick="tambahWaktuTimer()">
            ⏱️ Tambah Waktu Timer
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";
        const BATAS_MENIT = 10;
        let dataStandbyGlobal = [];
        let sedangFokus = false; // Mencegah dropdown ke-reset saat sedang dipilih

        window.onload = function() {
            muatDataStandby();
            setInterval(muatDataStandby, 3000); 
        };

        function muatDataStandby() {
            // Jika dropdown sedang diklik/dibuka oleh pengguna, jangan refresh tampilan agar tidak mereset pilihan
            if (sedangFokus) return;

            fetch(`${SCRIPT_URL}?aksi=getAntrian`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    dataStandbyGlobal = res.data.filter(item => item.status === "Standby");
                    
                    window.waktuServerHA = res.waktuStandbyHA || res.waktuStandbyPertama;
                    window.waktuServerAV = res.waktuStandbyAV;

                    renderDropdown();
                }
            }).catch(err => console.log("Gagal menyinkronkan data"));
        }

        function renderDropdown() {
            const selectEl = document.getElementById('select-promotor-standby');
            const nilaiTerpilihSebelumnya = selectEl.value; 
            
            let html = '<option value="">-- Pilih Promotor Standby --</option>';
            
            if (dataStandbyGlobal.length > 0) {
                const now = new Date().getTime();

                dataStandbyGlobal.forEach(item => {
                    const kategori = item.kategori || "HA";
                    let sisaTimerStr = "00:00";

                    let waktuStandbyTarget = (kategori === "AV") ? window.waktuServerAV : window.waktuServerHA;
                    
                    if (waktuStandbyTarget) {
                        const waktuMulai = new Date(waktuStandbyTarget).getTime();
                        if (!isNaN(waktuMulai)) {
                            const selisihMs = now - waktuMulai;
                            const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;
                            if (sisaMs > 0) {
                                const totalDetik = Math.floor(sisaMs / 1000);
                                const menit = Math.floor(totalDetik / 60);
                                const detik = totalDetik % 60;
                                sisaTimerStr = `${menit}:${detik < 10 ? '0' : ''}${detik}`;
                            } else {
                                sisaTimerStr = "Habis!";
                            }
                        }
                    }

                    html += `<option value="${item.nama}" data-kategori="${kategori}">
                        ${item.nama} (${kategori}) — Sisa Waktu: ${sisaTimerStr}
                    </option>`;
                });
            } else {
                html = '<option value="">-- Tidak ada promotor yang Standby --</option>';
            }
            
            selectEl.innerHTML = html;
            if (nilaiTerpilihSebelumnya) {
                selectEl.value = nilaiTerpilihSebelumnya;
            }
        }

        function tambahWaktuTimer() {
            const selectEl = document.getElementById('select-promotor-standby');
            const namaSales = selectEl.value;
            
            if(!namaSales) {
                alert("Silakan pilih promotor yang sedang standby terlebih dahulu!");
                return;
            }

            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const kategori = selectedOption.getAttribute('data-kategori') || "HA";

            if (confirm(`Yakin ingin menambah waktu timer untuk ${namaSales} (${kategori})?`)) {
                // Set fokus ke false agar sistem boleh me-refresh data setelah perintah kirim
                sedangFokus = false;

                const urlAksi = `${SCRIPT_URL}?aksi=tambahWaktuAdmin&namaSales=${encodeURIComponent(namaSales)}&kategori=${encodeURIComponent(kategori)}`;
                
                fetch(urlAksi, {
                    method: 'GET',
                    redirect: 'follow'
                })
                .then(res => res.json())
                .then(res => {
                    alert(res.pesan);
                    muatDataStandby(); // Langsung ambil data terbaru
                })
                .catch(err => {
                    console.error(err);
                    alert("Gagal terhubung ke server.");
                });
            }
        }
    </script>
</body>
</html>
