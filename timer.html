<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Timer - UFO Kebonsari</title>
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-ha: #3b82f6;
            --accent-av: #8b5cf6;
            --power-green: #10b981;
            --danger: #ef4444;
        }

        *, body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -moz-user-select: none;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LAYAR BLOKIR MUTLAK UNTUK HP / TABLET */
        #mobile-blocker {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #090d16;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        #mobile-blocker .icon { font-size: 64px; margin-bottom: 20px; }
        #mobile-blocker h2 { color: var(--danger); font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        #mobile-blocker p { color: var(--text-muted); font-size: 14px; line-height: 1.6; max-width: 320px; }

        /* TAMPILAN UTAMA */
        .header-app {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 800px;
        }

        .header-app h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .header-app p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .btn-fullscreen {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .btn-fullscreen:hover { background: rgba(59, 130, 246, 0.3); color: #ffffff; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .timer-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .timer-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
        }

        .timer-card.ha::before { background: var(--accent-ha); }
        .timer-card.av::before { background: var(--accent-av); }

        .badge-kategori {
            font-size: 13px;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .ha .badge-kategori { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .av .badge-kategori { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

        .nama-promotor {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            min-height: 38px;
            line-height: 1.2;
            word-break: break-word;
        }

        .sisa-waktu-display {
            font-size: 52px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 12px 0 24px 0;
            letter-spacing: -1px;
        }

        .ha .sisa-waktu-display { color: #93c5fd; }
        .av .sisa-waktu-display { color: #c4b5fd; }
        .sisa-waktu-display.habis { color: var(--danger) !important; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.5; } }

        .btn-power-container { width: 100%; margin-top: auto; }

        .btn-power {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
        }

        .btn-power:hover { transform: translateY(-2px); box-shadow: 0 14px 24px -5px rgba(16, 185, 129, 0.5); }
        .btn-power:active { transform: translateY(1px); }
        .btn-power:disabled { background: #475569; box-shadow: none; cursor: not-allowed; opacity: 0.5; }

        .power-icon { font-size: 22px; line-height: 1; }
        .kosong-state { color: var(--text-muted); font-size: 16px; font-weight: 500; font-style: italic; }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            padding: 16px;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: all 0.25s ease;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { font-size: 42px; margin-bottom: 12px; }
        .modal-title { font-size: 18px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
        .modal-actions { display: flex; gap: 12px; }

        .modal-btn {
            flex: 1; padding: 14px; border-radius: 12px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }

        .modal-btn-cancel { background: #334155; color: #cbd5e1; }
        .modal-btn-confirm { background: var(--power-green); color: white; }
        .modal-btn-ok { background: var(--primary); color: white; width: 100%; }
    </style>
</head>
<body>

    <!-- LAYAR BLOKIR MUTLAK UNTUK HP -->
    <div id="mobile-blocker">
        <div class="icon">🚫</div>
        <h2>AKSES DITOLAK</h2>
        <p>Halaman ini dikunci dan hanya dapat diakses melalui <b>Komputer SPV</b>. Akses dari HP (termasuk Mode Desktop) otomatis diblokir.</p>
    </div>

    <div class="header-app">
        <h1>PANEL KONTROL TIMER</h1>
        <p>UFO KEBONSARI MALANG</p>
        
    </div>

    <div class="cards-grid">
        <!-- CARD HA -->
        <div class="timer-card ha">
            <div class="badge-kategori">URUTAN NO 1 HA</div>
            <div id="nama-ha" class="nama-promotor">Memuat...</div>
            <div id="timer-ha" class="sisa-waktu-display">--:--</div>
            <div class="btn-power-container">
                <button id="btn-power-ha" class="btn-power" onclick="mintaKonfirmasi('HA')">
                    <span class="power-icon"></span> POWER ON
                </button>
            </div>
        </div>

        <!-- CARD AV -->
        <div class="timer-card av">
            <div class="badge-kategori">URUTAN NO 1 AV</div>
            <div id="nama-av" class="nama-promotor">Memuat...</div>
            <div id="timer-av" class="sisa-waktu-display">--:--</div>
            <div class="btn-power-container">
                <button id="btn-power-av" class="btn-power" onclick="mintaKonfirmasi('AV')">
                    <span class="power-icon"></span> POWER ON
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon">⏱️</div>
            <div id="modal-title" class="modal-title">Konfirmasi Power ON</div>
            <div id="modal-desc" class="modal-desc">Apakah Anda yakin?</div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";
        const BATAS_MENIT = 60;
        
        let promotorHA = null;
        let promotorAV = null;
        let targetKategoriAktif = "";

        // DETEKSI AKURAT BLOKIR HP (WALAUPUN PAKAI MODE DESKTOP)
        function cekPerangkatMutlak() {
            const ua = navigator.userAgent;
            
            // Cek kata kunci sistem operasi mobile secara ketat
            const isMobileOS = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
            
            // Cek apakah layar menggunakan teknologi sentuh utama (ciri khas HP/Tablet)
            const isTouchDevice = (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || ('ontouchstart' in window);

            // Jika terdeteksi OS HP atau layar sentuh murni, blokir mutlak
            if (isMobileOS || (isTouchDevice && window.innerWidth <= 1024)) {
                document.getElementById('mobile-blocker').style.display = 'flex';
            }
        }

        // FUNGSI LAYAR PENUH
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                }
            }
        }

        // MATIKAN KLIK KANAN & INSPECT
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'k')) || e.key === 'F12') {
                e.preventDefault();
            }
        });

        window.onload = function() {
            cekPerangkatMutlak();
            muatDataUrutanPertama();
            setInterval(muatDataUrutanPertama, 2000);
        };

        function muatDataUrutanPertama() {
            fetch(`${SCRIPT_URL}?aksi=getAntrian`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    const dataStandby = res.data.filter(item => item.status === "Standby");

                    promotorHA = dataStandby.find(item => (item.kategori || "HA") === "HA") || null;
                    promotorAV = dataStandby.find(item => item.kategori === "AV") || null;

                    window.waktuServerHA = res.waktuStandbyHA || res.waktuStandbyPertama;
                    window.waktuServerAV = res.waktuStandbyAV;

                    renderTampilan();
                }
            })
            .catch(err => console.log("Gagal menyinkronkan data"));
        }

        function renderTampilan() {
            const now = new Date().getTime();

            // RENDER HA
            const namaHaEl = document.getElementById('nama-ha');
            const timerHaEl = document.getElementById('timer-ha');
            const btnHaEl = document.getElementById('btn-power-ha');

            if (promotorHA) {
                namaHaEl.textContent = promotorHA.nama;
                namaHaEl.classList.remove('kosong-state');
                btnHaEl.disabled = false;

                let sisaTimerStr = hitungSisaWaktu(window.waktuServerHA, now);
                timerHaEl.textContent = sisaTimerStr;
                
                if (sisaTimerStr === "HABIS!") {
                    timerHaEl.classList.add('habis');
                } else {
                    timerHaEl.classList.remove('habis');
                }
            } else {
                namaHaEl.textContent = "Tidak Ada Antrian";
                namaHaEl.classList.add('kosong-state');
                timerHaEl.textContent = "--:--";
                timerHaEl.classList.remove('habis');
                btnHaEl.disabled = true;
            }

            // RENDER AV
            const namaAvEl = document.getElementById('nama-av');
            const timerAvEl = document.getElementById('timer-av');
            const btnAvEl = document.getElementById('btn-power-av');

            if (promotorAV) {
                namaAvEl.textContent = promotorAV.nama;
                namaAvEl.classList.remove('kosong-state');
                btnAvEl.disabled = false;

                let sisaTimerStr = hitungSisaWaktu(window.waktuServerAV, now);
                timerAvEl.textContent = sisaTimerStr;

                if (sisaTimerStr === "HABIS!") {
                    timerAvEl.classList.add('habis');
                } else {
                    timerAvEl.classList.remove('habis');
                }
            } else {
                namaAvEl.textContent = "Tidak Ada Antrian";
                namaAvEl.classList.add('kosong-state');
                timerAvEl.textContent = "--:--";
                timerAvEl.classList.remove('habis');
                btnAvEl.disabled = true;
            }
        }

        function hitungSisaWaktu(waktuStandbyTarget, now) {
            if (!waktuStandbyTarget) return "10:00";
            
            const waktuMulai = new Date(waktuStandbyTarget).getTime();
            if (isNaN(waktuMulai)) return "10:00";

            const selisihMs = now - waktuMulai;
            const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;

            if (sisaMs > 0) {
                const totalDetik = Math.floor(sisaMs / 1000);
                const menit = Math.floor(totalDetik / 60);
                const detik = totalDetik % 60;
                return `${menit}:${detik < 10 ? '0' : ''}${detik}`;
            } else {
                return "HABIS!";
            }
        }

        function mintaKonfirmasi(kategori) {
            targetKategoriAktif = kategori;
            const promotor = (kategori === "HA") ? promotorHA : promotorAV;
            if (!promotor) return;

            bukaModal({
                icon: "⏻",
                title: `POWER ON TIMER (${kategori})`,
                desc: `Reset/Tambah waktu timer untuk <br><b style="color: #ffffff; font-size: 16px;">${promotor.nama}</b>?`,
                actions: `
                    <button class="modal-btn modal-btn-cancel" onclick="tutupModal()">Batal</button>
                    <button class="modal-btn modal-btn-confirm" onclick="eksekusiPowerOn()">Ya, Tambah</button>
                `
            });
        }

        function eksekusiPowerOn() {
            const promotor = (targetKategoriAktif === "HA") ? promotorHA : promotorAV;
            if (!promotor) return;

            bukaModal({
                icon: "⏳",
                title: "Memproses...",
                desc: "Memperbarui waktu timer ke server...",
                actions: ""
            });

            const urlAksi = `${SCRIPT_URL}?aksi=tambahWaktuAdmin&namaSales=${encodeURIComponent(promotor.nama)}&kategori=${encodeURIComponent(targetKategoriAktif)}`;

            fetch(urlAksi, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "sukses") {
                    bukaModal({
                        icon: "✅",
                        title: "Berhasil!",
                        desc: res.pesan,
                        actions: `<button class="modal-btn modal-btn-ok" onclick="tutupModal()">Selesai</button>`
                    });
                    muatDataUrutanPertama();
                } else {
                    bukaModal({
                        icon: "⚠️",
                        title: "Gagal",
                        desc: res.pesan,
                        actions: `<button class="modal-btn modal-btn-ok" onclick="tutupModal()">Tutup</button>`
                    });
                }
            })
            .catch(err => {
                bukaModal({
                    icon: "❌",
                    title: "Koneksi Terganggu",
                    desc: "Gagal terhubung ke server.",
                    actions: `<button class="modal-btn modal-btn-ok" onclick="tutupModal()">Tutup</button>`
                });
            });
        }

        function bukaModal(config) {
            document.getElementById('modal-icon').innerHTML = config.icon;
            document.getElementById('modal-title').innerHTML = config.title;
            document.getElementById('modal-desc').innerHTML = config.desc;
            document.getElementById('modal-actions').innerHTML = config.actions;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
